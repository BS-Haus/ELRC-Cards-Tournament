<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="44" fill="#CBFB4F" opacity=".09"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="44%" r="60%">
      <stop offset="0" stop-color="#1d2412"/>
      <stop offset="1" stop-color="#0C0E10"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(512 512) scale(1.17) translate(-512 -528)">
  <!-- the card behind, fanned left -->
  <g transform="rotate(-14 512 560)">
    <rect x="292" y="210" width="400" height="560" rx="54" fill="#15181b" stroke="#CBFB4F" stroke-opacity=".35" stroke-width="14"/>
  </g>
  <!-- the front card, fanned right: the card back with the net on it -->
  <g transform="rotate(8 512 560)">
    <rect x="332" y="232" width="400" height="560" rx="54" fill="#15181b"/>
    <rect x="332" y="232" width="400" height="560" rx="54" fill="url(#stripes)"/>
    <rect x="332" y="232" width="400" height="560" rx="54" fill="none" stroke="#CBFB4F" stroke-width="16"/>
    <!-- the net from above: rim, and the ball -->
    <circle cx="532" cy="512" r="118" fill="#0C0E10" stroke="#CBFB4F" stroke-width="30"/>
    <circle cx="532" cy="512" r="34" fill="#CBFB4F"/>
  </g>
  </g>
</svg>
